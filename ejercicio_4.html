<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Aprieta el boton</p>
    <button onclick="suma()">Se incrementa el valor</button>
    <p id="resultado">Valor: 0</p>
    <script>
        let contador = 0;
        function suma(){
            while(contador<5){
                contador ++;
                document.getElementById("resultado").textContent = "valor" + contador;
                console.log(contador)
            }
    }
    </script>
</body>
</html>
