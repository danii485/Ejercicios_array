<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="palabra"></p>
    <button onclick="imprimirpalabra()">Saludo</button>
    <script>
        function imprimirpalabra(){
            var outputElement = document.getElementById("palabra");
        

            var suma = 0
            var array  ="Hola,que,tal,está,tu,gata".split(",");
            for(var i = 0; i < array.length; i++){
                suma+= array[i].length;
            }
            outputElement.textContent = "La suma de las longitudes de la palabra es:  " + suma;
    }
    </script>
</body>
</html>
