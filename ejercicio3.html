<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Aprieta el botón para ver si el número es primo </h2>
    <label for="numero">Ingresa un número</label><br>
    <input type="number" id="numero" name="numero" required><br><br>
    <button onclick="numeroprimo()">Numero primo o no</button>
    <p id="primo"></p>
    <script>
        function numeroprimo(){
            var numero = parseInt(document.getElementById("numero").value);
            var esprimo = true
            contador = 0;
            for(var i = 2; i<numero; i++){
                if(numero % i == 0){
                    contador ++;
                }
            }
            if (contador ==0){
                document.getElementById("primo").innerHTML = "El numero "+ numero + "es primo ";

            }else{
                document.getElementById("resultado").innerHTML = "El número " + numero + " no es primoo ";
            
            }
        }
</script>
    
</body>
</html>
